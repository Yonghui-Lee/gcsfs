common:
  bucket_types:
    - "regional"
    - "hns"

scenarios:
  - name: "list_flat"
    pattern: "ls"
    files: [65536, 131072]

  - name: "list_flat_folders"
    pattern: "ls"
    folders: [256]
    files: [65536, 131072]

  - name: "list_recursive_folders"
    depth: 8
    folders: [256]
    pattern: "ls"
    files: [65536, 131072]

  - name: "list_recursive_folders_deep"
    depth: 24
    folders: [256]
    pattern: "ls"
    files: [65536, 131072]

  - name: "find_flat"
    pattern: "find"
    files: [65536, 131072]

  - name: "find_flat_folders"
    pattern: "find"
    folders: [256]
    files: [65536, 131072]

  - name: "find_recursive_folders"
    depth: 8
    folders: [256]
    pattern: "find"
    files: [65536, 131072]

  - name: "find_recursive_folders_deep"
    depth: 24
    folders: [256]
    pattern: "find"
    files: [65536, 131072]

  - name: "walk_flat"
    pattern: "walk"
    files: [65536, 131072]

  - name: "walk_flat_folders"
    pattern: "walk"
    folders: [256]
    files: [65536, 131072]

  - name: "walk_recursive_folders"
    depth: 8
    folders: [256]
    pattern: "walk"
    files: [65536, 131072]

  - name: "walk_recursive_folders_deep"
    depth: 24
    folders: [256]
    pattern: "walk"
    files: [65536, 131072]

  # ADK FsspecArtifactService lists every version of one artifact on each save
  # and latest-version load: invalidate_cache(prefix), then
  # find(prefix + "/", detail=True) over <prefix>/0, <prefix>/1, ... objects
  # carrying custom metadata. 1200 crosses the 1000-object listing page.
  - name: "adk_version_prefix"
    pattern: "find_detail"
    files: [10, 100, 1000, 1200]
    rounds: 10
